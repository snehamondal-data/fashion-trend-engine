# Brand tiers for the Trickle-Down Trend Tracker (Fall/Winter 2026).
# Tier = price positioning. Luxury sets trends on the runway (Feb-Mar 2026 shows);
# semi_luxury adapts them; affordable mass-produces them.

luxury:
  - Chanel
  - Prada
  - Hermès
  - Ralph Lauren        # Ralph Lauren Collection (runway line)
  - Saint Laurent
  - Miu Miu
  - Bottega Veneta
  - Celine
  - Loewe
  - Gucci
  - Dior
  - The Row
  - Khaite

semi_luxury:            # contemporary / "everyday luxury"
  - Aritzia
  - Cult Gaia
  - name: Reformation   # common word; disambiguate
    search_term: "Reformation clothing"
  - Sandro
  - name: Theory        # common word; disambiguate
    search_term: "Theory clothing"
  - name: COS           # common word/acronym; disambiguate
    search_term: "COS fashion"
  - Toteme

mid_market:             # footwear & accessories, ~$80-400. Added for the suede-in-bags-and-shoes
                        # question: luxury material trends seem to land here, not at Zara/H&M.
                        # Partly a category, not a price rung -- excluded from classification.
  - name: Dolce Vita     # also an Italian phrase ("la dolce vita"); disambiguate
    search_term: "Dolce Vita shoes"
  - Tony Bianco
  - Steve Madden
  - Sam Edelman
  - name: Coach          # common word (sports coaches); disambiguate
    search_term: "Coach handbag"
  - Kate Spade
  # Michael Kors left out: it also shows on the runway and is cited as luxury
  # evidence in trends.yaml, so its press would blur the tier.

affordable:
  - Zara
  - H&M
  - name: Mango         # common word (the fruit); disambiguate
    search_term: "Mango fashion"
  - Uniqlo
  - Abercrombie & Fitch
