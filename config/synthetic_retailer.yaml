  - {sku_id: SB-009, product_name: Equestrian Jodhpur Trouser,     category: Bottoms,   attribute_type: silhouette, attribute: Equestrian,       trend_id: equestrian,        price: 138, base_weekly_units: 16, search_term: jodhpur trouser}
  - {sku_id: SB-010, product_name: Leopard Print Silk Blouse,      category: Tops,      attribute_type: print,      attribute: Leopard,          trend_id: leopard,           price: 118, base_weekly_units: 28, search_term: silk blouse}
