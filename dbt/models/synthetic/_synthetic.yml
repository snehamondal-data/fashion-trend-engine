version: 2

# Everything in this folder is SYNTHETIC: generated by src/synthetic_retailer.py
# for Sage & Blush, a fictional retailer, to test the demand-overlay analysis
# against a planted, known lag. It builds into its own `synthetic` schema.

models:
  - name: stg_synthetic__products
    description: Fictional product catalog. trend_id links a product to a real trend; NULL marks a core product (the negative control).
    columns:
      - name: sku_id
        data_tests: [unique, not_null]
      - name: price
        data_tests: [not_null]

  - name: stg_synthetic__inventory_weekly
    description: Weekly stock ledger per sku and size. units_sold is capped by on-hand stock.
    data_tests:
      - unique_combination:
          arguments:
            columns: [sku_id, size, week_start]
    columns:
      - name: sku_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_synthetic__products')
                field: sku_id
      - name: size
        data_tests:
          - accepted_values:
              arguments:
                values: [XXS, XS, S, M, L, XL]

  - name: stg_synthetic__site_searches
    description: Weekly on-site search counts per sku and search term.
    data_tests:
      - unique_combination:
          arguments:
            columns: [sku_id, search_term, week_start]
    columns:
      - name: sku_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_synthetic__products')
                field: sku_id

  - name: fct_synthetic__sku_week
    description: Sku x week fact with sales, returns, revenue, sell-through, searches and stockout flags.
    data_tests:
      - unique_combination:
          arguments:
            columns: [sku_id, week_start]
    columns:
      - name: sell_through
        description: units_sold / units available that week. 1.0 means it sold out.
